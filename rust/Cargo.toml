[workspace]
resolver = "2"
members = ["crates/ddm32-core", "crates/ddm32-cli", "crates/ddm32-gui"]

[workspace.package]
version = "3.0.0-alpha.4"
edition = "2021"
license = "GPL-3.0-or-later"
repository = "https://github.com/d0ukan/DDM32-Plus"
authors = ["d0ukan"]
rust-version = "1.88"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true
panic = "unwind"
